spring.application.name=${SPRING_APP_NAME:sarh}

# ===============================
# MULTIPART
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

# ===============================
# MEDIA
# ===============================
media.location=${MEDIA_LOCATION:mediafiles}

# Desactivado para forzar diseño sin dependencias circulares
spring.main.allow-circular-references=false

# ===============================
# DATASOURCE
# ===============================
spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_NAME:humanresource}
spring.datasource.username=${PG_USERNAME:postgres}
spring.datasource.password=${PG_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}

# ===============================
# JPA / HIBERNATE
# ===============================
# Por seguridad, el valor por defecto en producción debe ser "validate" (desarrollo puede sobreescribir con JPA_DDL_AUTO=update en .env)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:25}

# Desaconsejado en producción (anti-patrón de conexiones): se recomienda JOIN FETCH o @EntityGraph
# spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

logging.level.org.hibernate.SQL=${LOG_SQL_LEVEL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_SQL_BIND_LEVEL:INFO}

# ===============================
# JACKSON
# ===============================
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# ===============================
# MAIL
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

mail.from=${MAIL_FROM}

# ===============================
# JWT
# ===============================
jwt.secret.key=${JWT_SECRET_KEY}
jwt.user.generator=${JWT_USER_GENERATOR}
jwt.time.expiration=${JWT_EXPIRATION}
jwt.time.refreshExpiration=${JWT_REFRESH_EXPIRATION}

auth.refresh.cookie.secure=${AUTH_REFRESH_COOKIE_SECURE:true}
auth.refresh.cookie.same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
